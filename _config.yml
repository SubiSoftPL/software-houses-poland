url: "https://subisoftpl.github.io"
baseurl: "/software-houses-poland"

title: "Software Houses Poland"
tagline: "The curated list of the best software houses in Poland"
description: "Curated directory of the best software houses in Poland — top software development companies nationwide and by city: Warsaw, Kraków, Wrocław, Katowice & more."
lang: "en"
author: "Software Houses Poland"
twitter:
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - SETUP.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .gitignore

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

markdown: kramdown
kramdown:
  input: GFM
